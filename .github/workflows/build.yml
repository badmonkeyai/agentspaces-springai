name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least privilege for the default GITHUB_TOKEN: the build only reads.
permissions:
  contents: read

env:
  # The AgentSpaces core this build compiles against. Until the core 0.2.0
  # artifacts are on Maven Central, CI builds them from source first; once they
  # are, the "Install AgentSpaces core" steps can be removed.
  AGENTSPACES_REF: main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Check out AgentSpaces core
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: badmonkeyai/agentspaces
          ref: ${{ env.AGENTSPACES_REF }}
          path: agentspaces-core
      - name: Install AgentSpaces core
        run: mvn -B -ntp -f agentspaces-core/pom.xml install -DskipTests
      - name: Build and verify
        # -Pexamples: the example applications build and test with the library.
        run: mvn -B -ntp verify -Pexamples
